name: Compile dylib

on: [push] # 每次代码推送时触发

jobs:
  build:
    runs-on: macos-latest # 使用 macOS 环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          clang -dynamiclib -o libmylib.dylib mylib.c

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: libmylib.dylib
